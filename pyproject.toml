[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eli-lab-av-translator"
version = "0.6.0"
description = "A modular live audiovisual compositor for video collage, generative visuals and Sonic Pi control."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "moderngl>=5.10",
    "av>=12.0",
    "numpy>=1.26",
    "soundcard>=0.4.6",
    "python-osc>=1.10.2,<2",
    "qt-material>=2.17,<3",
]

[project.optional-dependencies]
midi = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
]
dev = [
    "ruff>=0.6",
]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "effects*", "generators*", "media*", "rendering*", "ui*"]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

