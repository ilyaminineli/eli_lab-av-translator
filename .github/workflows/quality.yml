name: Quality

on:
  push:
    branches:
      - main
      - implementation/**
      - feature/**
      - m5-**
      - m7/**
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Diagnose persistence-test import ordering
        run: python -m ruff check --select I --fix --diff tests/test_visual_persistence.py
      - name: Check formatting and lint for M7 changes
        run: >-
          python -m ruff check
          core/application.py
          core/composition.py
          core/layer_manager.py
          core/performance_modifiers.py
          core/performance_timeline.py
          core/visual_model.py
          core/visual_mutation_adapter.py
          core/automation.py
          core/generative_director.py
          core/performance_control.py
          core/performance_manager.py
          generators/catalog.py
          generators/rasterizer.py
          generators/text_pools.py
          media/library.py
          ui/asset_library_panel.py
          ui/automation_panel.py
          ui/deck_panel.py
          ui/effects_panel.py
          ui/generators_panel.py
          ui/icons.py
          ui/layer_panel.py
          ui/main_window.py
          ui/panel_layout.py
          ui/media_browser.py
          ui/modulator_bank_panel.py
          ui/performance_control_panel.py
          ui/performance_timeline_panel.py
          ui/performance_view.py
          ui/theme.py
          ui/transport_bar.py
          main.py
          tests
          scripts/build_pyinstaller.py
          scripts/package_release.py
          scripts/render_japanese_ui_proof.py
          scripts/check_static_site.py
      - name: Run unit and regression tests
        run: python -m pytest -q
      - name: Prepare a test-only Japanese font
        shell: pwsh
        run: |
          $fontDirectory = Join-Path $env:RUNNER_TEMP "japanese-proof-font"
          New-Item -ItemType Directory -Force -Path $fontDirectory | Out-Null
          $fontPath = Join-Path $fontDirectory "NotoSansJP-wght.ttf"
          $licensePath = Join-Path $fontDirectory "OFL.txt"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansjp/NotoSansJP%5Bwght%5D.ttf" -OutFile $fontPath
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansjp/OFL.txt" -OutFile $licensePath
          "ELI_JP_PROOF_FONT=$fontPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Render Japanese UI typography proof
        run: python scripts/render_japanese_ui_proof.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Upload Japanese UI typography proof
        uses: actions/upload-artifact@v4
        with:
          name: japanese-ui-typography-proof
          path: artifacts/japanese-ui-proof.png
          if-no-files-found: error
