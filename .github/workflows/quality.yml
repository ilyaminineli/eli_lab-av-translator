name: Quality

on:
  push:
    branches:
      - main
      - implementation/**
      - feature/**
      - m5-**
      - m7/**
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Check formatting and lint for M7 changes
        run: >-
          python -m ruff check
          core/application.py
          core/automation.py
          core/generative_director.py
          core/performance_manager.py
          generators/catalog.py
          generators/rasterizer.py
          generators/text_pools.py
          ui/automation_panel.py
          ui/deck_panel.py
          ui/generators_panel.py
          ui/main_window.py
          ui/performance_control_panel.py
          ui/theme.py
          ui/transport_bar.py
          main.py
          tests
      - name: Run unit and regression tests
        run: python -m pytest -q
