name: Windows Onefile Build

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up CPython 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements-build-win-x64.txt

      - name: Build and self-check onefile executable
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Upload onefile executable
        uses: actions/upload-artifact@v4
        with:
          name: eli-lab-av-translator-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
